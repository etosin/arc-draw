<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">ARC-DRAW</title>
  <desc id="d">A prompt on the left turns into an SAP BTP solution diagram on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B2E"/>
      <stop offset="1" stop-color="#123456"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475E75"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7FB2FF"/>
    </marker>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#fff" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>

  <!-- left: title + prompt -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="112" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="1">ARC-DRAW</text>
    <text x="64" y="152" font-size="21" fill="#BBD3EE">Describe your SAP architecture.</text>
    <text x="64" y="180" font-size="21" fill="#7FB2FF" font-weight="600">Your AI agent draws it — the SAP way.</text>

    <rect x="64" y="216" width="470" height="118" rx="14" fill="#0E2740" stroke="#2A5A8C" stroke-width="1.5"/>
    <text x="84" y="246" font-size="13" fill="#7FB2FF" font-weight="700" letter-spacing="1.5">PROMPT</text>
    <text x="84" y="274" font-size="16" fill="#E8F1FB">Draw a TO-BE inbound integration: partner →</text>
    <text x="84" y="298" font-size="16" fill="#E8F1FB">Cloud Integration → S/4HANA on-premise.</text>
    <text x="84" y="322" font-size="16" fill="#E8F1FB">Add API Management and a legend.</text>

    <g font-size="12" font-weight="600">
      <rect x="64" y="352" width="86" height="24" rx="12" fill="#0070F2"/>
      <text x="107" y="368" fill="#fff" text-anchor="middle">MCP server</text>
      <rect x="160" y="352" width="86" height="24" rx="12" fill="#1B4C7E"/>
      <text x="203" y="368" fill="#DCEBFA" text-anchor="middle">draw.io</text>
      <rect x="256" y="352" width="116" height="24" rx="12" fill="#1B4C7E"/>
      <text x="314" y="368" fill="#DCEBFA" text-anchor="middle">SAP BTP icons</text>
      <rect x="382" y="352" width="104" height="24" rx="12" fill="#1B4C7E"/>
      <text x="434" y="368" fill="#DCEBFA" text-anchor="middle">open source</text>
    </g>
  </g>

  <!-- middle arrow -->
  <path d="M552 275 H616" stroke="#7FB2FF" stroke-width="3" fill="none" marker-end="url(#ahw)"/>

  <!-- right: diagram card -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="636" y="36" width="596" height="328" rx="16" fill="#FFFFFF"/>
    <text x="660" y="66" font-size="14" font-weight="700" fill="#1D2D3E">Inbound integration — TO-BE</text>

    <!-- partner -->
    <rect x="660" y="150" width="96" height="60" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1.5"/>
    <text x="708" y="185" font-size="13" text-anchor="middle" fill="#1D2D3E" font-weight="600">Partner</text>

    <!-- BTP area -->
    <rect x="800" y="86" width="230" height="250" rx="12" fill="#EBF5FF" stroke="#0070F2" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="816" y="108" font-size="12" font-weight="700" fill="#0070F2">SAP BTP</text>
    <!-- integration suite area -->
    <rect x="818" y="124" width="194" height="192" rx="10" fill="#FFFFFF" stroke="#0070F2" stroke-width="1.5"/>
    <text x="832" y="144" font-size="11" font-weight="700" fill="#475E75">Integration Suite</text>
    <rect x="836" y="160" width="158" height="52" rx="8" fill="#0070F2"/>
    <text x="915" y="191" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">Cloud Integration</text>
    <rect x="836" y="236" width="158" height="52" rx="8" fill="#0070F2"/>
    <text x="915" y="267" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">API Management</text>

    <!-- on-prem container (grey, outside BTP) -->
    <rect x="1080" y="122" width="132" height="130" rx="12" fill="#EAECEE" stroke="#475E75" stroke-width="1.5"/>
    <text x="1096" y="144" font-size="11" font-weight="700" fill="#475E75">Customer</text>
    <rect x="1096" y="160" width="100" height="60" rx="8" fill="#0070F2"/>
    <text x="1146" y="195" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">S/4HANA</text>

    <!-- connectors -->
    <path d="M756 180 H836" stroke="#475E75" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M994 186 H1096" stroke="#475E75" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <path d="M915 212 V236" stroke="#475E75" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ah)"/>

    <!-- legend -->
    <g font-size="11" fill="#475E75">
      <path d="M1080 292 H1112" stroke="#475E75" stroke-width="2"/>
      <text x="1120" y="296">synchronous</text>
      <path d="M1080 316 H1112" stroke="#475E75" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="1120" y="320">asynchronous</text>
    </g>
  </g>
</svg>
